<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Praxis hero demo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Geist:wght@400;500&display=block" />
    <style>
      html,
      body {
        margin: 0;
        background: #e8e3d6;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: relative;
        overflow: hidden;
        background: #e8e3d6;
        color: #1e1d1a;
        font-family: "Geist", system-ui, sans-serif;
      }
      #stage * {
        box-sizing: border-box;
      }
      .abs {
        position: absolute;
        will-change: transform, opacity;
      }
      .label {
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .serif {
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 400;
      }
      .photo {
        overflow: hidden;
        border-radius: 2px;
        background: #2b2722;
      }
      .photo img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card-shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(20, 17, 13, 0.72) 0%, rgba(20, 17, 13, 0.24) 46%, rgba(20, 17, 13, 0.04) 72%);
      }
      .card-dim {
        position: absolute;
        inset: 0;
        background: rgb(20, 17, 13);
        opacity: 0;
      }
      .card-name {
        position: absolute;
        color: #f6f2e8;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.35);
        letter-spacing: 0.01em;
      }
      .card-arrow {
        position: absolute;
        color: #f6f2e8;
      }
      .print {
        overflow: hidden;
        border-radius: 2px;
        background: #e3d8c6;
      }
      .print img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 42%;
      }
      .touch {
        border-radius: 50%;
        border: 1.5px solid rgba(246, 242, 232, 0.95);
        background: rgba(246, 242, 232, 0.22);
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.18);
      }
      .row {
        display: flex;
        align-items: center;
        border-bottom: 1px solid #dcd5c6;
      }
      .box {
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 2px;
        background: #1e1d1a;
        color: #f1ede1;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="scene.js"></script>
  </body>
</html>
